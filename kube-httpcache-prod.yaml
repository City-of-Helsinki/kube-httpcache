trigger: none
pr: none

parameters:
  - name: publishTo
    displayName: 'Publish the image to'
    type: string
    default: both
    values:
      - both        # West Europe + Sweden Central (during the migration)
      - se          # Sweden Central only
      - we          # West Europe only

variables:
  environment: devtest
  KubeHttpCacheConfigName: 'kube-httpcache'
  # --- West Europe (legacy) -----------------------------------------------------------
  weConnectionType: 'openshift'
  weServiceConnection: 'devops-toolchain'
  weNamespace: 'devops-toolchain'
  wePool: 'Default'
  weImageRepository: 'container-registry.platta-net.hel.fi/devops-toolchain/kube-httpcache-fork'
  wePushSecret: 'quay-secret-new'
  # --- Sweden Central ------------------------------------------------------------------
  seConnectionType: 'kubernetes'
  seServiceConnection: 'devops-toolchain-dev-se'
  seNamespace: 'devops-toolchain'
  sePool: 'dev-se.platta.hel.fi'
  seImageRepository: 'image-registry.int.platta.hel.fi/hki-platta-components/kube-httpcache-fork'
  sePushSecret: 'quay-secret-new'
  ocVersion: 'v4.13.44'
  kubeHttpCacheVersion: 'stable-6.0'        # selected on 09-10-2026 # <-- bump tag number for each quarterly security review
  sonarQubeConnection: 'sonarcloud'
  # Go used for govulncheck 
  # Bump both lines together; checksum: curl -s https://dl.google.com/go/go<version>.linux-amd64.tar.gz.sha256
  goUpstreamVersion: '1.26.9'                # selected on 09-10-2026 (stdlib security fixes)
  goUpstreamSha256: '42d158b4d8f7b61ac0a830567c940a86098fb7aac52e467a5ebec03ef5cc2f8d'                # <-- sha256 of go1.26.9.linux-amd64.tar.gz (build fails until set)
  goVersion: '$(goUpstreamVersion)'          # govulncheck stage uses the same Go as the build
  # docker variables below
  ubiTag: '9.8-1791269371'                  # selected  on 09-10-2026 # <-- select latest version from  -- https://catalog.redhat.com/  - reponame - ubi/ubi9
  promExporterVersion: 'v1.7.0'             # selected  on 04-05-2026 # <-- prom exporter version number from  https://github.com/leontappe/prometheus_varnish_exporter.git
  varnishRepoVersion: '80'                  # selected  on 20-10-2025 # <-- https://packagecloud.io/varnishcache/  repo version from here  # if 8.0 then its 80
  varnishVersion: '8.0.0'                   # selected  on 20-10-2025 # <-- https://packagecloud.io/varnishcache/  varnish version from here - check version inside varnish repo selected
  varishRelease: '1'                        # selected  on 20-10-2025 # <-- https://packagecloud.io/varnishcache/  varnish release number from here - check release number - usually  1 
  varnishArch: 'el9.x86_64'                 # selected  on 20-10-2025 # <-- https://packagecloud.io/varnishcache/  varnish architecture from here - mostly does not change
stages:
  - stage: GoVulnCheck
    displayName: 'Go Vulnerability Scan'
    jobs:
      - job: VulnScan
        displayName: 'Run govulncheck'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
        - task: GoTool@0
          inputs:
            version: $(goVersion)
          
        - script: |
            export PATH=$PATH:$(go env GOPATH)/bin
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
          displayName: 'Install govulncheck and scan'
  - stage: SonarQube_Analysis
    displayName: 'SonarQube Analysis'
    dependsOn: GoVulnCheck
    jobs:
        - job: SonarQube
          displayName: 'Run SonarQube Scanner'
          steps:
            - task: SonarCloudPrepare@3
              inputs:
                SonarQube: $(sonarQubeConnection)
                organization: 'city-of-helsinki'
                scannerMode: 'CLI'
                configMode: 'manual'
                cliProjectKey: 'kube-httpcache'
                cliProjectName: 'kube-httpcache'
                cliSources: '.'
            - task: SonarCloudAnalyze@3
            - task: SonarCloudPublish@3
              inputs:
                pollingTimeoutSec: '300'
                failWhenQualityGateFails: true
  # One build per region: an OpenShift BuildConfig builds inside that cluster and pushes
  # to that region's registry. Both stages run in parallel after the scans.
  - ${{ if or(eq(parameters.publishTo, 'both'), eq(parameters.publishTo, 'we')) }}:
    - stage: build_kube_httpcache_we
      displayName: 'Build & publish (West Europe)'
      dependsOn: SonarQube_Analysis
      condition: succeeded()
      jobs:
        - template: templates/build-kube-httpcache.yml
          parameters:
            region: we
            pool: ${{ variables.wePool }}
            connectionType: ${{ variables.weConnectionType }}
            serviceConnection: ${{ variables.weServiceConnection }}
            insecureSkipTlsVerify: true       # as the previous West Europe build did
            namespace: $(weNamespace)
            imageRepository: $(weImageRepository)
            pushSecret: $(wePushSecret)
            environment: $(environment)
            ocVersion: $(ocVersion)
            KubeHttpCacheConfigName: $(KubeHttpCacheConfigName)
            kubeHttpCacheVersion: $(kubeHttpCacheVersion)
            ubiTag: $(ubiTag)
            goUpstreamVersion: $(goUpstreamVersion)
            goUpstreamSha256: $(goUpstreamSha256)
            promExporterVersion: $(promExporterVersion)
            varnishRepoVersion: $(varnishRepoVersion)
            varnishVersion: $(varnishVersion)
            varishRelease: $(varishRelease)
            varnishArch: $(varnishArch)

  - ${{ if or(eq(parameters.publishTo, 'both'), eq(parameters.publishTo, 'se')) }}:
    - stage: build_kube_httpcache_se
      displayName: 'Build & publish (Sweden Central)'
      dependsOn: SonarQube_Analysis
      condition: succeeded()
      jobs:
        - template: templates/build-kube-httpcache.yml
          parameters:
            region: se
            pool: ${{ variables.sePool }}
            connectionType: ${{ variables.seConnectionType }}
            serviceConnection: ${{ variables.seServiceConnection }}
            namespace: $(seNamespace)
            imageRepository: $(seImageRepository)
            pushSecret: $(sePushSecret)
            environment: $(environment)
            ocVersion: $(ocVersion)
            KubeHttpCacheConfigName: $(KubeHttpCacheConfigName)
            kubeHttpCacheVersion: $(kubeHttpCacheVersion)
            ubiTag: $(ubiTag)
            goUpstreamVersion: $(goUpstreamVersion)
            goUpstreamSha256: $(goUpstreamSha256)
            promExporterVersion: $(promExporterVersion)
            varnishRepoVersion: $(varnishRepoVersion)
            varnishVersion: $(varnishVersion)
            varishRelease: $(varishRelease)
            varnishArch: $(varnishArch)
