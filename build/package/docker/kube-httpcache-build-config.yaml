kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: kube-httpcache
  namespace: $NAMESPACE
  labels:
    app: kube-httpcache
    app.kubernetes.io/component: kube-httpcache
    app.kubernetes.io/instance: kube-httpcache-$ENVIRONMENT
spec:
  nodeSelector: null
  output:
    to:
      kind: DockerImage
      # IMAGE_REPOSITORY and PUSH_SECRET are substituted per region by templates/build-kube-httpcache.yml:
      #   West Europe : container-registry.platta-net.hel.fi/devops-toolchain/kube-httpcache-fork  (quay-secret-new)
      #   Sweden      : image-registry.int.platta.hel.fi/hki-platta-components/kube-httpcache-fork (quay-secret-new)
      name: >-
        $IMAGE_REPOSITORY:$KUBE_HTTP_CACHE_VERSION
    pushSecret:
      name: $PUSH_SECRET
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 500Mi
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: build/package/docker/Dockerfile
  postCommit: {}
  source:
    type: Binary
    contextDir: /
  triggers: []
  runPolicy: Serial