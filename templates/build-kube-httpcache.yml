parameters:
- name: region                     # we | se - used in job names only
  type: string
- name: pool                       # agent pool that can reach the cluster
  type: string
- name: connectionType             # kubernetes | openshift
  type: string
  default: kubernetes
  values: [kubernetes, openshift]
- name: serviceConnection          # name of the service connection of that type
  type: string
- name: insecureSkipTlsVerify      # pass --insecure-skip-tls-verify to oc start-build (old WE behaviour)
  type: boolean
  default: false
- name: namespace                  # namespace the BuildConfig runs in
  type: string
- name: imageRepository            # registry/org/repo without tag
  type: string
- name: pushSecret                 # dockerconfigjson secret in <namespace> with push rights
  type: string
- name: environment
  type: string
- name: KubeHttpCacheConfigName
  type: string
- name: ocVersion                  # oc-setup version (openshift); fallback download (kubernetes)
  type: string
- name: kubeHttpCacheVersion
  type: string
- name: goBuilderImage             # Go image used to compile
  type: string
- name: goExperiment               # GOEXPERIMENT for the build
  type: string
  default: 
- name: ubiTag
  type: string
- name: promExporterVersion
  type: string
- name: varnishRepoVersion
  type: string
- name: varnishVersion
  type: string
- name: varishRelease
  type: string
- name: varnishArch
  type: string

jobs:
  - job: BuildDockerImage_${{ parameters.region }}
    displayName: 'Build KubeHttpCache Image (${{ parameters.region }})'
    pool: ${{ parameters.pool }}
    steps:
      - ${{ if eq(parameters.connectionType, 'openshift') }}:
        - task: oc-setup@2
          displayName: 'OpenShift login (${{ parameters.serviceConnection }})'
          inputs:
            connectionType: 'OpenShift Connection Service'
            openshiftService: ${{ parameters.serviceConnection }}
            version: ${{ parameters.ocVersion }}
      - ${{ else }}:
        - task: Kubernetes@1
          displayName: 'Kubernetes login (${{ parameters.serviceConnection }})'
          inputs:
            connectionType: 'Kubernetes Service Connection'
            kubernetesServiceEndpoint: ${{ parameters.serviceConnection }}
            command: 'login'

      - script: |
          set -euo pipefail
          if command -v oc >/dev/null; then
            oc version --client
          else
            echo "oc not found on agent - installing ${OC_VERSION}"
            mkdir -p "$(Agent.TempDirectory)/oc"
            curl -sSfL "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${OC_VERSION#v}/openshift-client-linux.tar.gz" \
              | tar xz -C "$(Agent.TempDirectory)/oc" oc
            echo "##vso[task.prependpath]$(Agent.TempDirectory)/oc"
          fi
        displayName: 'Ensure oc CLI'
        env:
          OC_VERSION: ${{ parameters.ocVersion }}

      - script: |
          set -euo pipefail
          echo "Cluster:     $(oc whoami --show-server)"
          echo "Namespace:   ${NAMESPACE}"
          echo "Destination: ${IMAGE_REPOSITORY}:${KUBE_HTTP_CACHE_VERSION} (push secret ${PUSH_SECRET})"

          if ! oc get secret "$PUSH_SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "##vso[task.logissue type=error]Push secret ${PUSH_SECRET} not found in ${NAMESPACE}"
            exit 1
          fi

          DOCKERFILE="$(Build.SourcesDirectory)/build/package/docker/Dockerfile"
          CONFIG_FILE="$(Build.SourcesDirectory)/build/package/docker/${CONFIG_NAME}-build-config.yaml"

          # Substitute only the listed variables so bash/yum syntax in the Dockerfile stays intact
          envsubst '$VARNISH_REPO_VERSION $VARNISH_VERSION $VARNISH_RELEASE $VARNISH_ARCH $GO_BUILDER_IMAGE $GO_EXPERIMENT $__UBI_TAG__ $PROM_EXPORTER_VERSION' \
            < "$DOCKERFILE" > Dockerfile.tmp && mv Dockerfile.tmp "$DOCKERFILE"
          cat "$DOCKERFILE"

          envsubst '$NAMESPACE $ENVIRONMENT $CONFIG_NAME $KUBE_HTTP_CACHE_VERSION $IMAGE_REPOSITORY $PUSH_SECRET' \
            < "$CONFIG_FILE" > config.tmp && mv config.tmp "$CONFIG_FILE"
          cat "$CONFIG_FILE"

          oc apply -f "$CONFIG_FILE" -n "$NAMESPACE"

          # --follow streams the build log; --wait makes this step fail if the build fails
          TLS_FLAG=""
          [ "$INSECURE_SKIP_TLS_VERIFY" = "True" ] || [ "$INSECURE_SKIP_TLS_VERIFY" = "true" ] && TLS_FLAG="--insecure-skip-tls-verify=true"
          # shellcheck disable=SC2086
          oc start-build "$CONFIG_NAME" -n "$NAMESPACE" \
            --from-dir="$(Build.SourcesDirectory)" --follow --wait $TLS_FLAG
        displayName: 'Apply BuildConfig, build and push'
        env:
          ENVIRONMENT: ${{ parameters.environment }}
          NAMESPACE: ${{ parameters.namespace }}
          CONFIG_NAME: ${{ parameters.KubeHttpCacheConfigName }}
          IMAGE_REPOSITORY: ${{ parameters.imageRepository }}
          PUSH_SECRET: ${{ parameters.pushSecret }}
          INSECURE_SKIP_TLS_VERIFY: ${{ parameters.insecureSkipTlsVerify }}
          KUBE_HTTP_CACHE_VERSION: ${{ parameters.kubeHttpCacheVersion }}
          GO_BUILDER_IMAGE: ${{ parameters.goBuilderImage }}
          GO_EXPERIMENT: ${{ parameters.goExperiment }}
          __UBI_TAG__: ${{ parameters.ubiTag }}
          PROM_EXPORTER_VERSION: ${{ parameters.promExporterVersion }}
          VARNISH_REPO_VERSION: ${{ parameters.varnishRepoVersion }}
          VARNISH_VERSION: ${{ parameters.varnishVersion }}
          VARNISH_RELEASE: ${{ parameters.varishRelease }}
          VARNISH_ARCH: ${{ parameters.varnishArch }}